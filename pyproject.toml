[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kunz-speech-geometry"
version = "0.1.0"
description = "Exploratory neural-geometry analysis for the Kunz inner-speech dataset"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "h5py>=3.8",
  "ipykernel>=6.25",
  "jupyterlab>=4.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "nbclient>=0.8",
  "nbformat>=5.9",
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.scripts]
kunz-audit-mat = "kunz_speech_geometry.io:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
